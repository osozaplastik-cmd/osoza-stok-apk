name: APK olustur

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Bagimliliklari kur
        run: npm install --no-audit --no-fund

      - name: Android projesini olustur
        run: npx cap add android

      - name: Uygulama ikonlarini yerlestir
        run: |
          RES=android/app/src/main/res
          rm -rf "$RES"/mipmap-anydpi-v26
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "$RES/mipmap-$d"
            cp resources/mipmap-$d/ic_launcher.png "$RES/mipmap-$d/ic_launcher.png"
            cp resources/mipmap-$d/ic_launcher_round.png "$RES/mipmap-$d/ic_launcher_round.png"
            rm -f "$RES/mipmap-$d/ic_launcher_foreground.png"
          done

      - name: Web dosyalarini esitle
        run: npx cap sync android

      - name: APK derle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: APK dosyasini yukle
        uses: actions/upload-artifact@v4
        with:
          name: Osoza-Stok-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
